<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protocolo Raiz Nova — Seu plano personalizado</title>
<meta name="description" content="Diagnóstico educativo de queda capilar com trilhas separadas para homens e mulheres: plano de 90 dias, rotina, alimentação personalizada e biblioteca com base científica. Conteúdo educativo — não substitui avaliação médica.">
<meta property="og:type" content="website">
<meta property="og:title" content="Protocolo Raiz Nova — Seu plano personalizado">
<meta property="og:description" content="Responda algumas perguntas e receba um plano de 90 dias com rotina, alimentação e conteúdo educativo sobre a sua queda de cabelo.">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="grain"></div>

<!-- ============ HEADER ============ -->
<header class="topbar">
  <div class="topbar__brand">
    <span class="topbar__mark">✦</span>
    <span>Protocolo Raiz Nova</span>
  </div>
  <button class="topbar__reset" id="btnReset" title="Refazer diagnóstico">Refazer diagnóstico</button>
</header>

<main id="app"></main>

<!-- ============ TEMPLATES ============ -->

<template id="tpl-welcome">
  <section class="screen screen--welcome">
    <div class="welcome__blob"></div>
    <p class="kicker">antes de começar</p>
    <h1 class="display display--xl">Todo cabelo tem<br><em>uma história</em> por trás.</h1>
    <p class="lede">
      Queda de cabelo não é uma coisa só — e não é a mesma coisa em homens e em
      mulheres. A literatura descreve padrões, gatilhos e até mecanismos diferentes
      entre os dois. Por isso aqui você responde a uma trilha feita para o seu caso,
      e não a um questionário genérico.
    </p>

    <div class="name-field">
      <label for="nameInput">Como você se chama?</label>
      <input id="nameInput" type="text" autocomplete="given-name" maxlength="40"
        placeholder="Seu primeiro nome" enterkeyhint="next">
    </div>

    <div class="name-field">
      <label for="emailInput">Qual e-mail você usou na compra?</label>
      <input id="emailInput" type="email" autocomplete="email" inputmode="email"
        placeholder="seu@email.com" enterkeyhint="go">
      <p class="capture-err" id="emailErr" hidden>Digite o e-mail da sua compra para continuar.</p>
    </div>

    <button class="btn btn--primary btn--lg" data-action="start-quiz">
      Começar meu diagnóstico <span class="btn__arrow">→</span>
    </button>
    <p class="fineprint">Leva menos de 2 minutos.</p>
    <p class="fineprint" id="syncNote" hidden>
      Seu progresso nos 90 dias fica visível para a equipe do Protocolo, para acompanhar
      quem está seguindo o plano. <strong>O diário não:</strong> humor e anotações ficam
      só neste aparelho e ninguém além de você lê.
    </p>
    <p class="disclaimer disclaimer--welcome">
      <strong>Conteúdo educativo.</strong> Este material não é consulta médica, não faz
      diagnóstico e não substitui a avaliação de um dermatologista.
    </p>
  </section>
</template>

<template id="tpl-quiz">
  <section class="screen screen--quiz">
    <div class="quiz__progress">
      <div class="quiz__progress-bar"><div class="quiz__progress-fill" id="progressFill"></div></div>
      <span class="quiz__progress-label" id="progressLabel"></span>
    </div>
    <div id="quizQuestion" class="quiz__question"></div>
    <div id="quizInsight"></div>
    <div class="quiz__nav">
      <button class="btn btn--ghost" id="btnBack" data-action="quiz-back">← Voltar</button>
      <button class="btn btn--primary" id="btnNext" data-action="quiz-next">Continuar →</button>
    </div>
  </section>
</template>

<template id="tpl-analise">
  <section class="screen screen--analise">
    <p class="kicker">montando seu plano</p>
    <h1 class="display display--lg" id="analiseTitle">Cruzando as suas respostas…</h1>
    <ul class="analise-steps" id="analiseSteps"></ul>
  </section>
</template>

<template id="tpl-result">
  <section class="screen screen--result">
    <p class="kicker" id="resultFlagKicker">seu diagnóstico</p>
    <h1 class="display display--lg" id="resultTitle"></h1>
    <p class="lede" id="resultDesc"></p>

    <div class="alert alert--warn" id="redFlagBox" hidden>
      <strong>Vale uma atenção a mais:</strong>
      <span id="redFlagText"></span>
    </div>

    <div class="focus-grid" id="focusGrid"></div>

    <div id="resultUpsell"></div>

    <button class="btn btn--primary btn--lg" data-action="go-dashboard">
      Ver meu plano de 90 dias <span class="btn__arrow">→</span>
    </button>

    <p class="disclaimer">
      <strong>Isto é uma orientação educativa, não um diagnóstico.</strong>
      O nome do perfil acima descreve o padrão mais provável a partir das suas respostas —
      só um dermatologista, com exame do couro cabeludo e exames de sangue, pode confirmar
      a causa da sua queda.
    </p>
  </section>
</template>

<!-- ============ APP (abas) ============ -->

<template id="tpl-app">
  <section class="screen screen--app">

    <div class="app__head">
      <div>
        <p class="kicker" id="dashKicker"></p>
        <h1 class="display display--md" id="dashProfileName"></h1>
      </div>
      <div class="dash__streak">
        <span class="dash__streak-num" id="streakNum">0</span>
        <span class="dash__streak-label">dias concluídos</span>
      </div>
    </div>

    <div class="progress-track">
      <div class="progress-track__fill" id="dashProgressFill"></div>
    </div>

    <nav class="tabs" id="tabNav" role="tablist" aria-label="Seções do plano"></nav>

    <div id="tabPanel" class="tab-panel" role="tabpanel"></div>

    <p class="disclaimer">
      <strong>Conteúdo educativo — não é consulta médica.</strong>
      Nada aqui substitui avaliação, diagnóstico ou tratamento de um profissional de saúde.
      Se a queda for intensa, em placas, com coceira/descamação, ou não melhorar,
      procure um dermatologista.
    </p>

  </section>
</template>

<!-- ---- painéis de aba ---- -->

<template id="tpl-tab-hoje">
  <div class="tab-content">
    <div id="finalBanner"></div>

    <article class="card card--phase" id="phaseCard"></article>

    <article class="card card--routine">
      <div class="card__title-row">
        <h2 class="card__title">Rotina de hoje</h2>
        <span class="card__hint" id="routineHint"></span>
      </div>
      <ul class="checklist" id="todayChecklist"></ul>
      <p class="card__foot" id="todayFoot"></p>
    </article>

    <article class="card card--photos">
      <div class="card__title-row">
        <h2 class="card__title">Registro fotográfico</h2>
        <span class="card__hint">a única prova confiável</span>
      </div>
      <p class="card__text card__text--muted">
        Queda se avalia por comparação, não por memória. Mesma luz, mesmo ângulo,
        cabelo seco e na mesma posição — quatro fotos ao longo dos 90 dias.
      </p>
      <div class="photo-row" id="photoRow"></div>
    </article>

    <article class="card card--tracker">
      <div class="card__title-row">
        <h2 class="card__title">Seus 90 dias</h2>
        <span class="card__hint">toque para marcar</span>
      </div>
      <div id="phaseTracker"></div>
    </article>

    <article class="card card--note">
      <h2 class="card__title">Como você se sentiu hoje?</h2>
      <p class="card__text card__text--muted">
        Registrar o dia ajuda a enxergar padrão — queda costuma acompanhar fases,
        não dias isolados. <strong>Este espaço é só seu:</strong> humor e anotações
        ficam neste aparelho e não são compartilhados com ninguém.
      </p>
      <div class="mood-row" id="moodRow"></div>
      <textarea id="dayNote" class="note-field" rows="3"
        placeholder="Ex.: dormi mal, notei menos fio no ralo, usei chapinha…"></textarea>
      <p class="card__foot" id="noteStatus"></p>
    </article>

    <article class="card card--locked" id="bonus4Card"></article>
  </div>
</template>

<template id="tpl-tab-comida">
  <div class="tab-content">
    <header class="tab-intro">
      <p class="kicker" id="foodKicker">alimentação</p>
      <h2 class="display display--sm" id="foodHeadline"></h2>
      <p class="lede lede--tight" id="foodLede"></p>
    </header>

    <article class="card card--diet" id="dietFilter"></article>

    <article class="card card--swaps" id="foodSwaps" hidden></article>

    <article class="card card--gestante" id="gestanteNotes" hidden></article>

    <article class="card card--plate">
      <h3 class="card__title">O prato de referência</h3>
      <div class="plate-wrap">
        <div class="plate" id="plateViz" aria-hidden="true"></div>
        <ul class="plate-legend" id="plateLegend"></ul>
      </div>
      <p class="card__foot" id="plateFoot"></p>
    </article>

    <div class="food-cols">
      <article class="card card--eat">
        <h3 class="card__title"><span class="pill pill--yes">Coma mais</span></h3>
        <div id="foodYes" class="food-list"></div>
      </article>

      <article class="card card--avoid">
        <h3 class="card__title"><span class="pill pill--no">Modere ou evite</span></h3>
        <div id="foodNo" class="food-list"></div>
      </article>
    </div>

    <article class="card card--combo">
      <h3 class="card__title">Combinações que mudam o resultado</h3>
      <p class="card__text card__text--muted">
        Não é só o que você come — é com o que você come. Estas duplas alteram o quanto
        o seu corpo realmente aproveita.
      </p>
      <div id="foodCombos" class="combo-list"></div>
    </article>

    <article class="card card--nutrients">
      <div class="card__title-row">
        <h3 class="card__title">Os nutrientes que aparecem na literatura</h3>
        <span class="card__hint">toque para abrir</span>
      </div>
      <div id="nutrientList" class="nutrient-list"></div>
    </article>

    <article class="card card--myths">
      <h3 class="card__title">O que a ciência <em>não</em> confirma</h3>
      <p class="card__text card__text--muted">
        Suplemento não é inofensivo por ser vendido sem receita. Estes são os pontos
        em que a literatura contraria o senso comum.
      </p>
      <div id="mythList" class="myth-list"></div>
    </article>

    <article class="card card--safety">
      <div class="card__title-row">
        <h3 class="card__title">Antes de mudar qualquer coisa no seu prato</h3>
        <span class="card__hint">leia até o fim</span>
      </div>
      <ul class="safety-list" id="safetyFood"></ul>
    </article>

    <article class="card card--allergy">
      <div class="card__title-row">
        <h3 class="card__title">Alergia, intolerância e o que trocar</h3>
        <span class="card__hint">nenhum alimento aqui é obrigatório</span>
      </div>
      <p class="alert alert--danger" id="anaphylaxis"></p>
      <p class="card__text card__text--muted">
        Os itens marcados com <span class="allergens allergens--inline">⚠ contém</span> estão entre
        os alimentos que mais causam reação. Se algum deles é problema para você, não force:
        troque pela alternativa da mesma linha e o plano continua de pé.
      </p>
      <div id="subsList" class="subs-list"></div>
      <p class="card__foot">
        Esta seção não vem das revisões sobre queda capilar — é informação de segurança
        alimentar. Alergia diagnosticada se maneja com médico ou nutricionista, não com
        material educativo.
      </p>
    </article>

    <p class="source-note">
      <strong>Como ler os selos.</strong> Cada item acima mostra de onde vem a justificativa:
      <em>descrito nas revisões citadas</em> significa que a relação com queda capilar aparece
      na literatura usada aqui; <em>prática alimentar geral</em> significa recomendação sensata
      de alimentação, sem estudo específico ligando aquilo à queda. As duas coisas têm valor
      diferente e por isso não aparecem misturadas.
      Base: revisão sobre nutrição e queda capilar (J Prev Med Hyg, 2022) e capítulos
      brasileiros sobre classificação e manejo da queda capilar. Quantidades e reposição
      de qualquer nutriente devem ser definidas por médico ou nutricionista, a partir de exames.
    </p>
  </div>
</template>

<template id="tpl-tab-receitas">
  <div class="tab-content">
    <header class="tab-intro">
      <p class="kicker">receitas caseiras</p>
      <h2 class="display display--sm">Feitas na sua cozinha, usadas no seu banheiro</h2>
      <p class="lede lede--tight">
        As duas primeiras são as do seu perfil — comece por elas. As outras ficam
        disponíveis para quando a rotina já estiver de pé.
      </p>
    </header>
    <article class="card card--diet" id="dietFilterRecipes"></article>

    <article class="card card--safety">
      <div class="card__title-row">
        <h3 class="card__title">Segurança — leia antes da primeira aplicação</h3>
        <span class="card__hint">vale para todas</span>
      </div>
      <ul class="safety-list" id="safetyRecipes"></ul>
    </article>

    <p class="alert alert--danger" id="recipeFilterNote" hidden></p>

    <div id="recipeFull" class="recipe-full"></div>
    <p class="source-note">
      <strong>Sobre a fundamentação destas receitas.</strong> Das seis, só o alecrim aparece
      nas revisões que sustentam este app — e ainda assim como teste de laboratório e em
      camundongos, não como tratamento comprovado em pessoas. As outras cinco são uso
      cosmético tradicional: agem no fio que já cresceu, com efeito de conforto, brilho e
      redução de quebra. Nenhuma delas tem estudo mostrando que reduz queda, e o app não
      diz que tem. Receita caseira não é tratamento médico.
    </p>
  </div>
</template>

<template id="tpl-tab-entender">
  <div class="tab-content">
    <header class="tab-intro">
      <p class="kicker">entender</p>
      <h2 class="display display--sm">Antes de tratar, entender</h2>
      <p class="lede lede--tight">
        Leituras curtas. Elas explicam por que o seu cabelo está caindo, por que
        a melhora demora, e em que ponto o cuidado em casa deixa de ser suficiente.
      </p>
    </header>
    <div id="libraryList" class="library-list"></div>
  </div>
</template>

<script src="app.js"></script>
</body>
</html>
